services:
  parser:
    build: .
    image: sentinel:latest
    volumes:
    - ./data:/app/data
    - ./logs:/app/logs
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=cache
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - sentinel-net
    env_file:
      - .env    

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASS: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s      
    networks:
      - sentinel-net
    restart: unless-stopped       

  cache:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5      
    networks:
      - sentinel-net
    restart: unless-stopped       

volumes:
  postgres_data:
  redis_data:
networks:
  sentinel-net:
    driver: bridge


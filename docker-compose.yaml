services:
  parser:
    build: .
    image: sentinel:latest
    volumes:
    - ./data:/app/data
    - ./logs:/app/logs
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=cache
      - OTEL_SERVICE_NAME=sentinel
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      minio:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy    
      jaeger:
        condition: service_healthy
      otel-collector:
        condition: service_started         
    networks:
      - sentinel-net
    env_file:
      - .env    

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s      
    networks:
      - sentinel-net
    restart: unless-stopped       

  cache:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5      
    networks:
      - sentinel-net
    restart: unless-stopped  

  minio:
    image: quay.io/minio/minio:latest
    container_name: sentinel-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - minio_data:/data
      - ./minio_lifecycle.json:/tmp/lifecycle.json:ro      
    networks:
      - sentinel-net
    restart: unless-stopped       
    command: server /data --console-address ":9001"

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    network_mode: "host"                  # добавляем эту строку
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s    
      timeout: 10s    
      retries: 3        

    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_PASS}
      GF_LOG_LEVEL: ${GF_LOG_LEVEL}
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s      
    networks:
      - sentinel-net
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: sentinel-jaeger
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OLTP gRPC
      - "14250:14250" # gPRC for Collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - sentinel-net
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: sentinel-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml
    ports:
     - "4318:4318" # OTLP HTTP
    networks:
      - sentinel-net
    restart: unless-stopped

 
volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
networks:
  sentinel-net:
    driver: bridge


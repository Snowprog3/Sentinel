[project]
name = "sentinel"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "httpx[cli,socks]>=0.28",
    "loguru>=0.7",
    "parsel>=1.11.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "python-dotenv>=1.0",
    "scrapy>=2.15.2",
    "redis[hiredis]>=7.4.0",
    "minio>=7.2.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true

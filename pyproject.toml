[project]
name = "sentinel"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "asyncio>=4.0.0",
    "httpx[cli,socks]>=0.28",
    "loguru>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
]
